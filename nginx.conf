# sde-tech.com static site.
# TLS terminates at Coolify/Traefik, so this container only listens on port 80.
# Do not redirect every request to https here: Traefik already forwards
# https://sde-tech.com to this port, and an internal HTTP-to-HTTPS redirect would loop.
# Brotli (ngx_brotli) is not compiled into stock nginx:alpine, so responses use gzip.

server {
    listen 80;
    server_name www.sde-tech.com;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://sde-tech.com$request_uri;
}

server {
    listen 80 default_server;
    server_name sde-tech.com;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml application/rss+xml;

    add_header X-Content-Type-Options "nosniff" always;
    # No includeSubDomains and no preload: other SDE subdomains are separate apps.
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Repeated in every location that sets add_header. A location-level
    # add_header drops these. connect-src allows the contact token host and
    # Umami (script host cloud.umami.is, beacon host gateway.umami.is).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://voice-api.sde-tech.com https://cloud.umami.is https://gateway.umami.is; frame-src https://www.google.com https://maps.google.com; form-action 'self' https://voice-api.sde-tech.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The contact API sends a no-JS failure back as ?error=<sentence>,
    # with spaces encoded as +. nginx does not decode $arg_error, so the
    # page matches those raw values and prints its own sentence. It never
    # echoes the query string.
    # __FORM_STARTED_AT__ becomes the page-render time in seconds ($msec)
    # and is posted as form_started_at. no-store keeps a cached copy from
    # reusing that time. add_header in this location replaces the server
    # headers, so CSP, X-Frame-Options, Referrer-Policy, nosniff, and HSTS
    # are repeated here. sub_filter runs on the file before gzip. SSI still
    # handles ?error=.
    location = /contact-us.html {
        ssi on;
        ssi_types text/html;
        sub_filter_once on;
        sub_filter "__FORM_STARTED_AT__" "$msec";
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://voice-api.sde-tech.com https://cloud.umami.is https://gateway.umami.is; frame-src https://www.google.com https://maps.google.com; form-action 'self' https://voice-api.sde-tech.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # add_header inside a location replaces inherited add_header, so the
    # security headers are repeated wherever Cache-Control is set.
    location /css/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://voice-api.sde-tech.com https://cloud.umami.is https://gateway.umami.is; frame-src https://www.google.com https://maps.google.com; form-action 'self' https://voice-api.sde-tech.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://voice-api.sde-tech.com https://cloud.umami.is https://gateway.umami.is; frame-src https://www.google.com https://maps.google.com; form-action 'self' https://voice-api.sde-tech.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Self-hosted fonts. Same cache window as /css and /images.
    location /fonts/ {
        default_type font/woff2;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://voice-api.sde-tech.com https://cloud.umami.is https://gateway.umami.is; frame-src https://www.google.com https://maps.google.com; form-action 'self' https://voice-api.sde-tech.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://voice-api.sde-tech.com https://cloud.umami.is https://gateway.umami.is; frame-src https://www.google.com https://maps.google.com; form-action 'self' https://voice-api.sde-tech.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        log_not_found off;
    }
}
