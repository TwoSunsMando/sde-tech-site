# sde-tech.com static site.
# TLS terminates at Coolify/Traefik, so this container only listens on port 80.
# Do not redirect every request to https here: Traefik already forwards
# https://sde-tech.com to this port, and an internal HTTP-to-HTTPS redirect would loop.
# Brotli (ngx_brotli) is not compiled into stock nginx:alpine, so responses use gzip.

server {
    listen 80;
    server_name www.sde-tech.com;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://sde-tech.com$request_uri;
}

server {
    listen 80 default_server;
    server_name sde-tech.com;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml application/rss+xml;

    add_header X-Content-Type-Options "nosniff" always;
    # No includeSubDomains and no preload: other SDE subdomains are separate apps.
    add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # add_header inside a location replaces inherited add_header, so the
    # security headers are repeated wherever Cache-Control is set.
    location /css/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # Self-hosted fonts. Same cache window as /css and /images.
    location /fonts/ {
        default_type font/woff2;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        log_not_found off;
    }
}
